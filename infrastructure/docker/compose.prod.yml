# One stack per environment, separated by project name and env file. See docs/DEPLOYMENT.md.
#   docker compose -p sellnest-production --env-file .env.production -f infrastructure/docker/compose.prod.yml up -d --build
#
# Only nginx publishes a port, and by default only on loopback, so a proxy already on the
# server stays in charge of ports 80 and 443. PostgreSQL and Redis publish nothing.
name: sellnest

x-app-env: &app-env
  NODE_ENV: production
  TZ: Asia/Dhaka
  WEB_URL: ${WEB_URL:?set WEB_URL}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  API_PORT: 4100
  DATABASE_URL: postgresql://${POSTGRES_USER:-sellnest}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sellnest}?schema=public&connection_limit=${DB_CONNECTION_LIMIT:-10}
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-auto}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
  S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
  SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM}
  RUN_WORKER_IN_API: 'false'

services:
  postgres:
    image: ${POSTGIS_IMAGE:-postgis/postgis:17-3.5}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sellnest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sellnest}
    volumes: ['pgdata:/var/lib/postgresql/data']
    networks: [data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # noeviction: BullMQ loses jobs if Redis evicts keys.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction', '--requirepass', '${REDIS_PASSWORD:?set REDIS_PASSWORD}']
    volumes: ['redisdata:/data']
    networks: [data]
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "${REDIS_PASSWORD}" --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10

  # One-off: docker compose ... run --rm migrate
  migrate:
    image: sellnest-api:${IMAGE_TAG:-latest}
    build: &api-build
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
    profiles: [tools]
    command: ['npx', 'prisma', 'migrate', 'deploy']
    environment: *app-env
    networks: [data]
    depends_on:
      postgres: { condition: service_healthy }

  # One-off: docker compose ... run --rm seed (reference data; no demo content unless SEED_DEMO=true)
  seed:
    image: sellnest-api:${IMAGE_TAG:-latest}
    profiles: [tools]
    command: ['npx', 'tsx', 'prisma/seed.ts']
    environment:
      <<: *app-env
      SEED_DEMO: ${SEED_DEMO:-false}
    networks: [data, edge]
    depends_on:
      postgres: { condition: service_healthy }

  # One-off: docker compose ... run --rm -e ADMIN_BOOTSTRAP_EMAIL -e ADMIN_BOOTSTRAP_PASSWORD bootstrap-admin
  bootstrap-admin:
    image: sellnest-api:${IMAGE_TAG:-latest}
    profiles: [tools]
    command: ['npx', 'tsx', 'prisma/bootstrap-admin.ts']
    environment: *app-env
    networks: [data]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    image: sellnest-api:${IMAGE_TAG:-latest}
    build: *api-build
    restart: unless-stopped
    environment: *app-env
    networks: [data, edge]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4100/api/v1/health/live').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    image: sellnest-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    environment: *app-env
    networks: [data, edge]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    image: sellnest-web:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infrastructure/docker/web.Dockerfile
    restart: unless-stopped
    environment:
      WEB_URL: ${WEB_URL:?set WEB_URL}
      API_INTERNAL_URL: http://api:4100
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
    networks: [edge]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/robots.txt').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports: ['${HTTP_BIND:-127.0.0.1:8088}:80']
    volumes: ['../nginx/sellnest.conf:/etc/nginx/conf.d/default.conf:ro']
    networks: [edge]
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }

networks:
  # internal: containers here have no route out and cannot be reached from outside.
  data:
    internal: true
  edge:

volumes:
  pgdata:
  redisdata:
