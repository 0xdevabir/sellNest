# Runs inside the nginx container, behind whatever terminates TLS on the server.
# Holds no domain name or certificate. See docs/DEPLOYMENT.md for the TLS proxy.

# The address of the real visitor, from the proxy in front. Only private ranges are trusted to
# say so, which means the port must never be published to the internet without TLS proxy in front.
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      '';
}

# Keep in step with IMAGE_MAX_BYTES in the API, plus some multipart overhead.
client_max_body_size 12m;

upstream sellnest_web { server web:3000; keepalive 16; }
upstream sellnest_api { server api:4100; keepalive 16; }

server {
  listen 80 default_server;
  server_name _;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  # Replaced, not appended: rate limits rely on this, and a visitor must not be able to forge it.
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  proxy_set_header Connection "";

  location /api/ {
    proxy_pass http://sellnest_api;
    proxy_read_timeout 60s;
  }

  location /socket.io/ {
    proxy_pass http://sellnest_api;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
  }

  location /_next/static/ {
    proxy_pass http://sellnest_web;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://sellnest_web;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
  }
}
